<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日反思</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ cache_bust }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">每日反思</a>
        <div class="nav-links">
            <a href="/history" class="nav-link">历史记录</a>
            <a href="/weekly" class="nav-link">每周回顾</a>
            {% if current_user.is_authenticated %}
            <span class="nav-user">{{ current_user.username }}</span>
            <a href="/logout" class="nav-link nav-logout">退出</a>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}?v={{ cache_bust }}"></script>
</body>
</html>
