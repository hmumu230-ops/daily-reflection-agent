<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日反思 - {{ '注册' if mode == 'register' else '登录' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ cache_bust }}">
</head>
<body>
    <main class="container">
        <div class="journal-card auth-card">
            <h1 class="journal-greeting">每日反思</h1>
            <p class="journal-subtitle">{{ '创建账号，开始你的反思之旅' if mode == 'register' else '登录后继续你的反思' }}</p>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="auth-form">
                <input type="text" name="username" placeholder="用户名" required
                       class="auth-input" value="{{ request.form.get('username', '') }}">
                <input type="password" name="password" placeholder="密码" required class="auth-input">
                {% if mode == 'register' %}
                <input type="password" name="confirm" placeholder="确认密码" required class="auth-input">
                {% endif %}
                <button type="submit" class="journal-btn">{{ '注册' if mode == 'register' else '登录' }}</button>
            </form>

            <div class="auth-switch">
                {% if mode == 'register' %}
                    已有账号？<a href="{{ url_for('login') }}">去登录</a>
                {% else %}
                    没有账号？<a href="{{ url_for('register') }}">注册一个</a>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
